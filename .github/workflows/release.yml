name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag
        run: test "${GITHUB_REF_NAME}" = "v$(sed -n 's/^version=//p' modules/module.prop)"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "${GITHUB_ENV}"

      - name: Package module
        run: python3 tools/build.py mkmod

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/dist/cluxd-*.zip --title "${GITHUB_REF_NAME}" --generate-notes
